[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorbtX"
version = "0.1.0"
description = "A pure wrapper over vectorbt adding instruments, leverage, multi-currency and MT4/MT5 metrics."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "vectorbt==1.1.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3,<4.0",
    "scipy",
    # ⚠️ Not ours to fix, but load-bearing. vectorbt 1.1.0 declares `plotly>=4.12.0` with
    # no upper bound, and registers a plotly template containing a `scattermapbox` key
    # (`vectorbt/_settings.py:96`). plotly 7 removed that trace type, so `import vectorbt`
    # raises ValueError at import time and NOTHING works. 6.9.0 is the newest that loads.
    # Remove this once vectorbt caps plotly itself.
    "plotly<7",
]

[project.optional-dependencies]
excel = ["openpyxl"]
rates = ["requests"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["vectorbtx*"]

# The importable name is lowercase `vectorbtx`, always. There was once a `vectorbtX.py`
# case-alias module so `import vectorbtX` worked on case-sensitive filesystems; it was
# removed because setuptools' editable-install finder maps BOTH spellings straight to the
# package directory, so the alias never executed and the two names became two distinct
# module objects — forking the patch flag and re-running `apply_patches()`. One spelling
# is the fix. The distribution is still published as `vectorbtX`; PyPI normalises the case.

[tool.pytest.ini_options]
testpaths = ["tests"]
